# .github/workflows/release-fork.yml
#
# Fork-tailored release pipeline for github.com/mikhaylo1/mediamtx
# Reproduces upstream's exact 7-RID archives + checksums.sha256, but trimmed of
# the upstream-only steps a fork can't run (Docker Hub push, provenance attestation
# scoped to bluenviron). The assets it publishes are byte-for-byte name/format
# compatible with MediaMtx.Launcher's Get-MediaMtxBinaries.ps1.
#
# Trigger options:
#   1. Push a tag matching v*           -> builds at that tag (correct version naming)
#   2. Actions UI "Run workflow"        -> pick the TAG (e.g. v1.19.1) as the ref,
#      (workflow_dispatch)                 NOT a branch, or archive names get a
#                                          git-describe suffix (see note below).
#
# IMPORTANT — version-string naming rule:
#   Archive names come from `git describe --tags` of the checked-out commit
#   (upstream's versiongetter -> internal/core/VERSION, embedded). The build MUST
#   run with HEAD sitting exactly on the tag, or you get
#   mediamtx_v1.19.1-3-gdeadbeef_linux_amd64.tar.gz and the launcher's URL 404s.
#   => Always trigger from a TAG whose commit is HEAD.

name: release-fork

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write          # needed to create the Release on this repo

jobs:
  binaries:
    runs-on: ubuntu-latest # has Docker + make preinstalled
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history...
          fetch-tags: true  # ...and tags, so `git describe --tags` resolves the version

      - name: Build all 7 platform archives (upstream `make binaries`)
        run: make binaries
        # `make binaries` runs the upstream multi-stage Docker cross-compile
        # (CGO_ENABLED=0, GOOS/GOARCH/GOARM x7). Identical logic to the official
        # release, so the output is drop-in compatible. Needs outbound network
        # (go mod download + the hls.js fetch during `go generate`) — GitHub
        # hosted runners have it.

      - name: Generate checksums.sha256 (upstream format)
        run: cd binaries && sha256sum -b * > checksums.sha256

      - name: Show produced assets
        run: ls -la binaries

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: binaries/*
          # tag_name defaults to the pushed tag; on workflow_dispatch from a tag
          # ref it also resolves correctly. Creates/updates the Release on
          # github.com/mikhaylo1/mediamtx so Get-MediaMtxBinaries.ps1 -Repo
          # mikhaylo1/mediamtx -VersionTag <tag> consumes it unchanged.
