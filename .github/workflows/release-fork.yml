# .github/workflows/release-fork.yml
#
# Fork release pipeline for github.com/vidi-hub/mediamtx.
# Reproduces upstream's exact 7-RID archives + checksums.sha256 (drop-in compatible
# with MediaMtx.Launcher's Get-MediaMtxBinaries.ps1), trimmed of the upstream-only
# steps a fork can't run (Docker Hub push, bluenviron-scoped provenance), and gated
# on a unit-test job that exercises the ADR-019-003 RTMP stream-key path carriage.
#
# Trigger: push a tag matching v* whose commit is HEAD (so `git describe --tags`
# yields a clean version that names the archives), or run via the Actions UI on a tag.

name: release-fork

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Unit tests — RTMP stream-key path carriage (ADR-019-003) + conf round-trip
        run: go test -count=1 ./internal/conf/... ./internal/servers/rtmp/...

  binaries:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build all 7 platform archives (upstream `make binaries`)
        run: make binaries

      - name: Generate checksums.sha256 (upstream format)
        run: cd binaries && sha256sum -b * > checksums.sha256

      - name: Show produced assets
        run: ls -la binaries

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: binaries/*
